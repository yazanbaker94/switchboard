[package]
name = "switchboard"
version = "0.1.0"
description = "Two accounts. One clear place."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem", "Win32_UI_Notifications"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
